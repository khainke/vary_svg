environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  args: ^2.3.1
  csv: ^8.0.0
  xml: ^7.1.0
  logging: ^1.3.0
  path: ^1.9.1

dev_dependencies:
  lints: ^6.1.0
  test: ^1.16.0
